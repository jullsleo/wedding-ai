<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Wedding Quiz 💍</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Lato:wght@300;400&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;width:100%;}
body{
  min-height:100vh;
  font-family:'Georgia',serif;
  background:linear-gradient(135deg,#fdf6e3 0%,#f5eef8 45%,#eaf4fb 100%);
  display:flex;align-items:flex-start;justify-content:center;
  padding:1.5rem 1rem 8.5rem;
  user-select:none;-webkit-user-select:none;
}

#stage{
  width:100%;max-width:min(900px,94vw);
  display:flex;flex-direction:column;align-items:center;
  gap:clamp(1rem,2.2vh,1.5rem);position:relative;z-index:1;
}

.glass{
  background:rgba(255,255,255,0.38);
  backdrop-filter:blur(18px) saturate(160%);
  -webkit-backdrop-filter:blur(18px) saturate(160%);
  border:1.5px solid rgba(255,255,255,0.72);
  border-radius:22px;
  box-shadow:0 4px 32px rgba(180,160,220,0.13), inset 0 1px 0 rgba(255,255,255,0.9);
}

.q-label{
  font-size:12px;letter-spacing:0.14em;text-transform:uppercase;
  color:#b9a8d4;font-family:'Lato',sans-serif;font-weight:300;
}

.q-number{
  width:66px;height:66px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-family:'Playfair Display',serif;font-size:1.9rem;font-weight:600;color:#6b5490;
}
.q-number small{font-size:1rem;color:#b9a8d4;font-weight:400;margin-left:1px;}

.q-card{width:100%;padding:2rem 2.2rem;text-align:center;}
.q-text{
  font-family:'Playfair Display',serif;
  font-size:clamp(1.7rem,3.4vw,2.7rem);color:#4a3f6b;line-height:1.4;font-weight:500;
}

.q-hint{
  margin-top:0.9rem;font-family:'Lato',sans-serif;font-size:0.9rem;
  color:#a795c9;letter-spacing:0.04em;
}

.progress-wrap{width:100%;height:4px;background:rgba(200,180,230,0.2);border-radius:99px;overflow:hidden;}
.progress-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#d8b4f8,#93c5fd);transition:width 0.5s ease;}

.timer-slot{display:flex;align-items:center;justify-content:center;gap:0.9rem;min-height:96px;}
.timer-wrap{position:relative;width:96px;height:96px;flex-shrink:0;}
.timer-wrap svg{position:absolute;top:0;left:0;transform:rotate(-90deg);}
.t-track{fill:none;stroke:rgba(200,180,240,0.2);stroke-width:6;}
.t-prog{fill:none;stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset 1s linear,stroke 0.4s;}
.t-num{
  position:absolute;top:0;left:0;width:96px;height:96px;
  display:flex;align-items:center;justify-content:center;
  font-family:'Playfair Display',serif;
  font-size:2rem;color:#7a65a5;font-weight:500;line-height:1;
}

.opts-grid{width:100%;display:grid;gap:0.9rem;}
.opts-2col{grid-template-columns:1fr 1fr;}

.opt-card{
  padding:1.2rem 1.4rem;text-align:center;
  transition:transform 0.2s,box-shadow 0.2s,opacity 0.3s;
  position:relative;overflow:hidden;
}
.opt-card .card-text{font-family:'Playfair Display',serif;font-size:clamp(1.15rem,2.1vw,1.6rem);color:#4a3f6b;font-weight:400;}
.opt-letter{
  display:block;width:32px;height:32px;margin:0 auto 0.5rem;border-radius:50%;
  background:rgba(255,255,255,0.6);border:1px solid rgba(200,170,230,0.5);
  font-family:'Lato',sans-serif;font-size:0.95rem;font-weight:700;color:#8d7fb0;
  line-height:30px;text-align:center;
}

.cy{background:rgba(255,247,210,0.22);border-color:rgba(255,218,120,0.55)!important;}
.cl{background:rgba(240,225,255,0.22);border-color:rgba(200,170,230,0.55)!important;}
.cb{background:rgba(220,237,255,0.22);border-color:rgba(160,200,240,0.55)!important;}
.cp{background:rgba(255,230,237,0.22);border-color:rgba(240,185,200,0.55)!important;}

.opt-correct{
  background:rgba(240,255,240,0.72)!important;
  border-color:rgba(150,210,140,0.85)!important;
  box-shadow:0 0 0 3px rgba(160,220,150,0.25),
             0 0 22px 6px rgba(150,215,135,0.35),
             0 0 55px 16px rgba(190,240,175,0.18),
             inset 0 1px 0 rgba(255,255,255,0.95)!important;
  transform:scale(1.035)!important;
}
.opt-wrong{opacity:0.32!important;transform:scale(0.97)!important;}

.btn{
  font-family:'Playfair Display',serif;font-size:1rem;color:#6b5490;
  background:rgba(255,255,255,0.52);
  border:1.5px solid rgba(200,170,230,0.65);
  border-radius:50px;padding:0.7rem 2.4rem;cursor:pointer;
  backdrop-filter:blur(10px);transition:background 0.18s,transform 0.12s;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.9);
}
.btn:hover{background:rgba(255,255,255,0.78);transform:translateY(-1px);}

.reveal-tag{
  font-size:11px;letter-spacing:0.12em;text-transform:uppercase;
  color:#8aab7a;font-family:'Lato',sans-serif;font-weight:400;
  animation:fadeup 0.4s ease;
}

.round-name{font-family:'Playfair Display',serif;font-size:2.6rem;color:#4a3f6b;font-weight:600;line-height:1.1;}
.round-sub{font-family:'Lato',sans-serif;color:#b9a8d4;letter-spacing:0.14em;text-transform:uppercase;font-size:0.92rem;}
.round-meta{font-family:'Lato',sans-serif;color:#8d7fb0;font-size:1rem;line-height:1.6;}
.intro-meta{font-size:0.88rem;color:#b9a8d4;font-family:'Lato',sans-serif;margin-top:0.7rem;font-weight:300;}

/* final answer key */
.key-list{text-align:left;width:100%;}
.key-round{font-family:'Lato',sans-serif;text-transform:uppercase;letter-spacing:0.12em;font-size:0.72rem;color:#b9a8d4;margin:0.9rem 0 0.4rem;}
.key-round:first-child{margin-top:0;}
.key-row{display:flex;align-items:flex-start;gap:0.6rem;padding:0.4rem 0;border-bottom:1px solid rgba(200,180,230,0.18);font-family:'Lato',sans-serif;font-size:0.92rem;color:#4a3f6b;line-height:1.35;}
.key-num{flex:0 0 18px;color:#b9a8d4;font-weight:700;}
.key-q{flex:1 1 auto;}
.key-a{flex:0 0 auto;max-width:44%;text-align:right;color:#6f8a4f;font-weight:700;}

/* top controls */
.top-controls{position:fixed;top:14px;right:14px;display:flex;gap:8px;z-index:6;}
.icon-btn{
  width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:1rem;color:#6b5490;
  background:rgba(255,255,255,0.55);border:1.5px solid rgba(200,170,230,0.6);
  backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 rgba(255,255,255,0.9);
  transition:transform 0.15s,background 0.15s,opacity 0.15s;
}
.icon-btn:hover{transform:translateY(-2px);background:rgba(255,255,255,0.82);}
.icon-btn.is-off{opacity:0.4;}

/* voice picker */
.voice-pick{display:flex;align-items:center;gap:0.6rem;font-family:'Lato',sans-serif;font-size:0.8rem;color:#b9a8d4;letter-spacing:0.06em;flex-wrap:wrap;justify-content:center;}
.voice-pick select{
  font-family:'Lato',sans-serif;font-size:0.85rem;color:#6b5490;
  padding:0.5rem 0.9rem;border-radius:50px;cursor:pointer;max-width:260px;
  background:rgba(255,255,255,0.6);border:1.5px solid rgba(200,170,230,0.6);
}

.hint{ display:none; }

/* bottom control bar */
.controls-bar{
  position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:0.45rem;z-index:6;
  padding:0.5rem 0.7rem;border-radius:50px;
}
.ctrl-btn{
  height:44px;min-width:44px;border-radius:50px;
  display:flex;align-items:center;justify-content:center;gap:0.35rem;
  cursor:pointer;font-size:1.05rem;color:#6b5490;padding:0 0.6rem;
  background:rgba(255,255,255,0.5);border:1.5px solid rgba(200,170,230,0.55);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.9);
  transition:transform 0.15s,background 0.15s,opacity 0.15s;
}
.ctrl-btn:hover{transform:translateY(-2px);background:rgba(255,255,255,0.82);}
.ctrl-btn.wide{font-family:'Lato',sans-serif;font-size:0.82rem;letter-spacing:0.04em;padding:0 0.9rem;}
.ctrl-btn.dim{opacity:0.4;}
.ctrl-sep{width:1px;height:26px;background:rgba(200,170,230,0.45);margin:0 0.15rem;}

.melt-out{animation:meltOut 0.6s ease forwards;}
.melt-in {animation:meltIn  0.65s ease forwards;}
@keyframes meltOut{
  0%{opacity:1;transform:scaleY(1) translateY(0) skewX(0);filter:blur(0) brightness(1);}
  40%{opacity:0.7;transform:scaleY(1.12) translateY(10px) skewX(-2deg);filter:blur(2px) brightness(1.1);}
  100%{opacity:0;transform:scaleY(0.5) translateY(60px) skewX(0);filter:blur(14px) brightness(1.4);}
}
@keyframes meltIn{
  0%{opacity:0;transform:scaleY(1.18) translateY(-30px) skewX(-2deg);filter:blur(12px) brightness(1.3);}
  60%{opacity:0.9;transform:scaleY(0.98) translateY(3px) skewX(-0.5deg);filter:blur(1px) brightness(1.02);}
  100%{opacity:1;transform:scaleY(1) translateY(0) skewX(0);filter:blur(0) brightness(1);}
}
@keyframes fadeup{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

.blob{position:absolute;font-size:3.2rem;filter:blur(2px);opacity:0.32;user-select:none;will-change:transform,opacity;}
@keyframes pulse1{0%{transform:scale(1) rotate(0);opacity:.28}25%{transform:scale(1.3) rotate(8deg);opacity:.38}50%{transform:scale(.9) rotate(-5deg);opacity:.30}75%{transform:scale(1.2) rotate(12deg);opacity:.35}100%{transform:scale(1) rotate(0);opacity:.28}}
@keyframes pulse2{0%{transform:scale(1) translateY(0) rotate(0);opacity:.30}33%{transform:scale(1.4) translateY(-14px) rotate(-10deg);opacity:.40}66%{transform:scale(.85) translateY(8px) rotate(6deg);opacity:.24}100%{transform:scale(1) translateY(0) rotate(0);opacity:.30}}
@keyframes pulse3{0%{transform:scale(1.1) rotate(0) translateX(0);opacity:.32}20%{transform:scale(.8) rotate(-15deg) translateX(-8px);opacity:.22}50%{transform:scale(1.35) rotate(10deg) translateX(6px);opacity:.42}80%{transform:scale(.95) rotate(-5deg) translateX(-4px);opacity:.30}100%{transform:scale(1.1) rotate(0) translateX(0);opacity:.32}}
@keyframes float1{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-10px) rotate(5deg)}}
@keyframes float2{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-8px) rotate(-4deg)}}

#fx{position:fixed;inset:0;z-index:50;pointer-events:none;}
@media (prefers-reduced-motion:reduce){.blob{animation:none;}}
</style>
</head>
<body>

<div id="bg-layer" style="position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;"></div>

<div class="top-controls">
  <button class="icon-btn is-on" id="ttsToggle" title="Read questions aloud">🗣️</button>
  <button class="icon-btn is-on" id="sfxToggle" title="Sound effects">🔔</button>
  <button class="icon-btn" id="fsToggle" title="Fullscreen">⛶</button>
</div>

<div id="stage"></div>
<div class="hint" id="hint">tap / space = continue&nbsp;·&nbsp;→ next&nbsp;·&nbsp;← back&nbsp;·&nbsp;P pause&nbsp;·&nbsp;R restart round</div>

<div class="controls-bar glass" id="controlsBar">
  <button class="ctrl-btn" id="prevBtn" title="Previous (←)">⏮</button>
  <button class="ctrl-btn" id="pauseBtn" title="Pause / Resume timer (P)">⏸</button>
  <button class="ctrl-btn" id="nextBtn" title="Next (→)">⏭</button>
  <span class="ctrl-sep"></span>
  <button class="ctrl-btn wide" id="restartRoundBtn" title="Restart this round (R)">↺ Round</button>
  <button class="ctrl-btn wide" id="restartQuizBtn" title="Restart whole quiz">↺ Quiz</button>
</div>

<canvas id="fx"></canvas>

<script src="questions.js"></script>
<script>
/* ===================== shuffle Bride/Groom questions ===================== */
// Pool all "bg" round questions, shuffle, and redistribute across those rounds
// so the Bride/Groom answers come out in a random order every time.
(function shuffleBgRounds(){
  const bgRounds = (QUIZ.rounds || []).filter(r => r.type === "bg");
  if(!bgRounds.length) return;
  let pool = [];
  bgRounds.forEach(r => { pool = pool.concat(r.questions); });
  for(let i = pool.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  let idx = 0;
  bgRounds.forEach(r => { const c = r.questions.length; r.questions = pool.slice(idx, idx + c); idx += c; });
})();

/* ===================== build the step list ===================== */
const STEPS = [{ type: "intro" }];
QUIZ.rounds.forEach((round, ri) => {
  STEPS.push({ type: "roundIntro", ri });
  const askType   = round.type === "bg" ? "bgAsk"   : "mcAsk";
  const checkType = round.type === "bg" ? "bgCheck" : "mcCheck";
  round.questions.forEach((_, qi) => STEPS.push({ type: askType, ri, qi }));
  STEPS.push({ type: "checkIntro", ri });
  round.questions.forEach((_, qi) => STEPS.push({ type: checkType, ri, qi }));
});
STEPS.push({ type: "score" });

const totalQuestions = QUIZ.rounds.reduce((a, r) => a + r.questions.length, 0);

/* ===================== state ===================== */
let step = 0;
let gen = 0;                 // bumped each screen; guards stale async callbacks
let revealed = false;        // whether the current screen's answer has been shown
let sfxOn = true;
let ttsOn = true;
let ticker = null, tLeft = 0, tMax = 0, autoAdv = null, tDone = null, tPaused = false;
let holdPaused = false;      // narration (voice) paused via the pause button
const MC_COLORS = ["cy", "cl", "cb", "cp"];
const R = 40, C = 2 * Math.PI * R;

const stage = document.getElementById("stage");
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

// spell a number in English words so a Russian voice reads it with an accent
// (instead of converting the digit to a Russian word)
const NUM_WORDS = ["zero","one","two","three","four","five","six","seven","eight","nine","ten",
  "eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen","twenty"];
const TENS = ["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
function numWord(n){
  n = Math.round(n);
  if(n < 0) return String(n);
  if(n <= 20) return NUM_WORDS[n];
  if(n < 100){ const t = Math.floor(n/10), o = n%10; return TENS[t] + (o ? "-" + NUM_WORDS[o] : ""); }
  return String(n);
}

const LETTERS = ["A","B","C","D","E","F"];
function cleanOpt(o){ return String(o).replace(/[✓🔥🍮💃🍩🍣🍔]/g,"").trim(); }

/* ===================== audio engine (synth, no files) ===================== */
let ac = null;
function audio(){ if(!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if(ac.state==="suspended") ac.resume(); return ac; }
function tone(freq, start, dur, type="sine", vol=0.18){
  const a = audio(), t0 = a.currentTime + start;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(g).connect(a.destination); o.start(t0); o.stop(t0+dur+0.02);
}
function glide(f1, f2, start, dur, type="sawtooth", vol=0.16){
  const a = audio(), t0 = a.currentTime + start;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t0); o.frequency.linearRampToValueAtTime(f2, t0+dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(g).connect(a.destination); o.start(t0); o.stop(t0+dur+0.02);
}
function noiseBurst(start, dur, vol, filterType, filterFreq){
  const a = audio(), t0 = a.currentTime + start;
  const len = Math.max(1, Math.floor(a.sampleRate*dur));
  const buf = a.createBuffer(1, len, a.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
  const src = a.createBufferSource(); src.buffer = buf;
  const g = a.createGain(), f = a.createBiquadFilter();
  f.type = filterType||"bandpass"; f.frequency.value = filterFreq||1200;
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  src.connect(f).connect(g).connect(a.destination); src.start(t0); src.stop(t0+dur);
}
const SFX = {
  click(){ if(sfxOn) tone(420,0,0.08,"triangle",0.10); },
  whoosh(){ if(sfxOn){ glide(220,900,0,0.3,"sine",0.05); noiseBurst(0,0.3,0.045,"bandpass",1300); } },
  drumroll(dur){ if(!sfxOn) return; const h=Math.floor(dur*22); for(let i=0;i<h;i++) noiseBurst(i/h*dur,0.035,0.05+0.05*(i/h),"bandpass",1900); noiseBurst(dur,0.14,0.17,"bandpass",1100); },
  buzzer(){ if(sfxOn){ tone(155,0,0.22,"square",0.15); tone(155,0.27,0.32,"square",0.15); } },
  tada(){ if(!sfxOn) return; tone(523,0,0.12,"triangle",0.13); tone(659,0.12,0.12,"triangle",0.13); tone(784,0.24,0.5,"triangle",0.15); tone(1047,0.24,0.5,"sine",0.11); noiseBurst(0.24,0.45,0.06,"highpass",6500); },
  fanfare(){ if(sfxOn) [523,659,784,1047].forEach((f,i)=>tone(f,i*0.12,0.5,"triangle",0.15)); },
  applause(dur){ if(!sfxOn) return; dur=dur||2.6; noiseBurst(0,dur,0.05,"highpass",2200); const c=Math.floor(dur*45); for(let i=0;i<c;i++) noiseBurst(Math.random()*dur,0.02,0.015+Math.random()*0.03,"bandpass",1400+Math.random()*2200); },
};

/* driving "think music" while the timer runs */
let cdNodes = [], cdMaster = null;
function cdNote(freq, start, dur, type, vol, dest){
  const a = audio(), t0 = a.currentTime+start;
  const o = a.createOscillator(), g = a.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t0);
  g.gain.setValueAtTime(0.0001,t0); g.gain.linearRampToValueAtTime(vol,t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g).connect(dest); o.start(t0); o.stop(t0+dur+0.03); cdNodes.push(o,g);
}
function startCountdownMusic(seconds){
  if(!sfxOn) return;
  const a = audio();
  cdMaster = a.createGain(); cdMaster.gain.value = 1.0; cdMaster.connect(a.destination);
  const beat = 0.5, bass = [110,110,164.81,110], arp = [220,261.63,329.63,392.00];
  let i = 0;
  for(let t=0; t<seconds; t+=beat, i++){
    const k = 0.55 + 0.45*(t/seconds);
    cdNote(bass[i%4], t, beat*0.9, "sawtooth", 0.12*k, cdMaster);
    cdNote(arp[i%4], t, beat*0.42, "square", 0.05*k, cdMaster);
    cdNote(arp[(i+2)%4], t+beat/2, beat*0.42, "square", 0.05*k, cdMaster);
  }
}
function stopCountdownMusic(){
  cdNodes.forEach(n => { try{ n.stop && n.stop(); }catch(e){} try{ n.disconnect(); }catch(e){} });
  cdNodes = []; if(cdMaster){ try{ cdMaster.disconnect(); }catch(e){} cdMaster = null; }
}

/* ===================== text-to-speech ===================== */
const hasTTS = "speechSynthesis" in window;
let ttsVoice = null, enVoices = [];
function rankVoice(v){
  let s = 0;
  if(/^en/i.test(v.lang)) s += 10;
  if(/en[-_]?(US|GB|AU)/i.test(v.lang)) s += 2;
  if(/natural|online|neural/i.test(v.name)) s += 9;
  if(/google/i.test(v.name)) s += 5;
  if(/aria|jenny|emma|libby|sonia|guy|samantha/i.test(v.name)) s += 3;
  if(/zira|david/i.test(v.name)) s -= 2;
  return s;
}
function refreshVoices(){
  if(!hasTTS) return;
  const all = speechSynthesis.getVoices() || [];
  // English voices + Russian voices (a ru-RU voice reading English = Russian accent)
  enVoices = all.filter(v => /^(en|ru)/i.test(v.lang));
  if(!enVoices.length) enVoices = all.slice();
  enVoices.sort((a,b)=>rankVoice(b)-rankVoice(a));
  // default to the Google Russian voice (English read with a Russian accent)
  if(!ttsVoice && enVoices.length){
    ttsVoice =
      enVoices.find(v => /^ru/i.test(v.lang) && /google/i.test(v.name)) ||
      enVoices.find(v => /^ru/i.test(v.lang)) ||
      enVoices[0];
  }
  const sel = document.getElementById("voicePicker");
  if(sel){
    sel.innerHTML = "";
    enVoices.forEach((v,i)=>{
      const o = document.createElement("option");
      const accent = /^ru/i.test(v.lang) ? " — Russian accent 🇷🇺" : "";
      const natural = /natural|online|neural|google/i.test(v.name) ? "  ✨" : "";
      o.value = i; o.textContent = v.name + accent + natural;
      if(v === ttsVoice) o.selected = true;
      sel.appendChild(o);
    });
    sel.onchange = e => {
      ttsVoice = enVoices[+e.target.value] || ttsVoice;
      cancelSpeech();
      const u = new SpeechSynthesisUtterance("Bride, or groom?");
      if(ttsVoice) u.voice = ttsVoice; u.rate = 1.0; u.pitch = 1.05;
      speechSynthesis.speak(u);
    };
  }
}
function cancelSpeech(){ if(hasTTS) speechSynthesis.cancel(); }

// run fn after ms, but hold while narration is paused and drop if we've navigated
function afterDelay(ms, fn){
  const myGen = gen;
  const run = () => {
    if(myGen !== gen) return;
    if(holdPaused){ setTimeout(run, 150); return; }
    fn();
  };
  setTimeout(run, ms);
}

function speak(text, onEnd){
  if(!ttsOn || !hasTTS){ if(onEnd) onEnd(); return; }
  cancelSpeech(); holdPaused = false;
  let done = false; const finish = ()=>{ if(done) return; done = true; if(onEnd) onEnd(); };
  const u = new SpeechSynthesisUtterance(text);
  if(ttsVoice) u.voice = ttsVoice; u.rate = 1.0; u.pitch = 1.05; u.volume = 1.0;
  u.onend = finish; u.onerror = finish;
  speechSynthesis.speak(u); updatePauseBtn();
  afterDelay(3000 + text.length*90, finish);   // pause-aware failsafe
}
// read the question (or wait a beat if voice is off) then run cb
function speakThen(text, cb){
  if(ttsOn && hasTTS) speak(text, cb);
  else setTimeout(cb, 1500);
}

// speak several parts in sequence with a gap between them, then run cb
function speakSequence(parts, gap, cb){
  const myGen = gen;
  if(!ttsOn || !hasTTS){ afterDelay(1800, () => { if(cb) cb(); }); return; }
  cancelSpeech(); holdPaused = false;
  const mk = t => { const u = new SpeechSynthesisUtterance(t); if(ttsVoice) u.voice = ttsVoice; u.rate = 1.0; u.pitch = 1.05; return u; };
  let i = 0;
  const speakNext = () => {
    if(myGen !== gen) return;
    if(i >= parts.length){ if(cb) cb(); return; }
    const text = parts[i++];
    const u = mk(text);
    let advanced = false;
    const adv = () => { if(advanced || myGen !== gen) return; advanced = true; afterDelay(gap, speakNext); };
    u.onend = adv; u.onerror = adv;
    speechSynthesis.speak(u); updatePauseBtn();
    afterDelay(3000 + text.length * 90, adv);   // pause-aware failsafe
  };
  speakNext();
}

// say a prefix, pause for suspense, then reveal the answer visually AND
// speak it at the same instant (onReveal fires exactly when the word is said)
function revealWithVoice(prefix, answerSpoken, onReveal, gap=700){
  const myGen = gen;
  let fired = false;
  const fire = () => { if(fired || myGen !== gen) return; fired = true; if(onReveal) onReveal(); };
  if(!ttsOn || !hasTTS){ afterDelay(650, fire); return; }
  cancelSpeech(); holdPaused = false;
  const mk = t => { const u = new SpeechSynthesisUtterance(t); if(ttsVoice) u.voice = ttsVoice; u.rate = 1.0; u.pitch = 1.05; return u; };
  const u1 = mk(prefix);
  const afterPrefix = () => { if(myGen !== gen) return; afterDelay(gap, () => {
    fire();                                   // highlight…
    speechSynthesis.speak(mk(answerSpoken));  // …spoken at the same moment
    updatePauseBtn();
  }); };
  u1.onend = afterPrefix; u1.onerror = afterPrefix;
  speechSynthesis.speak(u1); updatePauseBtn();
  afterDelay(3200 + prefix.length * 90 + gap, fire);  // pause-aware failsafe
}

/* ===================== confetti ===================== */
const fx = document.getElementById("fx"), fxCtx = fx.getContext("2d");
let pieces = [], fxRunning = false;
function sizeFx(){ fx.width = innerWidth; fx.height = innerHeight; }
sizeFx(); addEventListener("resize", sizeFx);
function burst(colors, n=140){
  for(let i=0;i<n;i++) pieces.push({
    x: innerWidth/2 + (Math.random()-0.5)*240, y: innerHeight*0.4,
    vx:(Math.random()-0.5)*11, vy:-Math.random()*11-4, g:0.28+Math.random()*0.12,
    size:6+Math.random()*7, rot:Math.random()*6, vr:(Math.random()-0.5)*0.3,
    color: colors[i%colors.length], life:90+Math.random()*40,
  });
  if(!fxRunning){ fxRunning = true; requestAnimationFrame(frame); }
}
function frame(){
  fxCtx.clearRect(0,0,fx.width,fx.height);
  pieces.forEach(p=>{ p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.life--;
    fxCtx.save(); fxCtx.translate(p.x,p.y); fxCtx.rotate(p.rot);
    fxCtx.fillStyle=p.color; fxCtx.globalAlpha=Math.max(0,Math.min(1,p.life/40));
    fxCtx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.45); fxCtx.restore(); });
  pieces = pieces.filter(p=>p.life>0 && p.y<fx.height+40);
  if(pieces.length) requestAnimationFrame(frame);
  else { fxCtx.clearRect(0,0,fx.width,fx.height); fxRunning = false; }
}
const BRIDE_COLORS = ["#f6d97e","#f0c14b","#fff3c9"];
const GROOM_COLORS = ["#bcd8a8","#9cc47f","#e7f0db"];

/* ===================== render helpers ===================== */
function setHTML(html){ stage.className=""; void stage.offsetWidth; stage.innerHTML=html; stage.className="melt-in"; }
function transition(buildFn){ stage.className="melt-out"; setTimeout(()=>{ buildFn(); stage.className="melt-in"; }, 620); }
function timerSVG(t, max){
  const pct = max ? t/max : 0, offset = C*(1-pct);
  const col = pct>0.5 ? "#b8a5e0" : pct>0.25 ? "#f6c97e" : "#f4a5a5";
  return `<div class="timer-wrap"><svg width="96" height="96" viewBox="0 0 96 96">
    <circle class="t-track" cx="48" cy="48" r="${R}"/>
    <circle class="t-prog" cx="48" cy="48" r="${R}" stroke="${col}" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${offset.toFixed(2)}"/>
  </svg><div class="t-num">${t}</div></div>`;
}
function renderTimer(){ const ts = document.getElementById("timer-slot"); if(ts) ts.innerHTML = timerSVG(tLeft, tMax); }

function clearTimers(){
  if(ticker){ clearInterval(ticker); ticker = null; }
  if(autoAdv){ clearTimeout(autoAdv); autoAdv = null; }
  tDone = null; tPaused = false; holdPaused = false;
  stopCountdownMusic(); cancelSpeech();
  updatePauseBtn();
}
function runTicker(){
  ticker = setInterval(()=>{
    tLeft--;
    if(tLeft <= 0){ tLeft = 0; renderTimer(); clearInterval(ticker); ticker = null;
      stopCountdownMusic(); SFX.buzzer();
      const d = tDone; tDone = null; updatePauseBtn(); if(d) d(); return; }
    renderTimer();
    if(tLeft === 3 && tMax >= 8) SFX.drumroll(3);
  }, 1000);
}
function startCountdown(seconds, done){
  clearTimers();
  tMax = seconds; tLeft = seconds; tDone = done; tPaused = false;
  renderTimer();
  startCountdownMusic(seconds);
  runTicker();
  updatePauseBtn();
}
function pauseTimer(){
  if(!ticker || tPaused) return;
  tPaused = true;
  clearInterval(ticker); ticker = null;
  stopCountdownMusic();            // pre-scheduled audio can't pause, so stop it
  updatePauseBtn();
}
function resumeTimer(){
  if(!tPaused) return;
  tPaused = false;
  startCountdownMusic(tLeft);      // restart music for the remaining seconds
  runTicker();
  updatePauseBtn();
}
function togglePause(){
  if(ticker){ pauseTimer(); return; }        // countdown running → pause it
  if(tPaused){ resumeTimer(); return; }       // countdown paused → resume it
  if(hasTTS && speechSynthesis.speaking){      // narration playing → pause/resume the voice
    if(holdPaused){ holdPaused = false; try{ speechSynthesis.resume(); }catch(e){} }
    else { holdPaused = true; try{ speechSynthesis.pause(); }catch(e){} }
    updatePauseBtn();
  }
}
function updatePauseBtn(){
  const b = document.getElementById("pauseBtn");
  if(!b) return;
  const paused = tPaused || holdPaused;
  const active = !!ticker || (hasTTS && speechSynthesis.speaking);
  b.textContent = paused ? "▶" : "⏸";
  b.classList.toggle("dim", !active && !paused);   // dim only when nothing is happening
}
function restartRound(){
  const s = STEPS[step];
  if(s.ri == null) return;         // not inside a round (intro / score)
  const target = STEPS.findIndex(x => x.type === "roundIntro" && x.ri === s.ri);
  if(target >= 0){ clearTimers(); step = target; transition(showStep); }
}

/* ===================== navigation ===================== */
function showStep(){
  gen++;
  revealed = false;
  const s = STEPS[step];
  ({
    intro:      renderIntro,
    roundIntro: () => renderRoundIntro(s),
    bgAsk:      () => renderBgAsk(s),
    checkIntro: () => renderCheckIntro(s),
    bgCheck:    () => renderBgCheck(s),
    mcAsk:      () => renderMcAsk(s),
    mcCheck:    () => renderMcCheck(s),
    score:      renderScore,
  }[s.type] || (()=>{}))();
}
function next(){ clearTimers(); if(step < STEPS.length-1){ step++; transition(showStep); } }
function prev(){ clearTimers(); if(step > 0){ step--; transition(showStep); } }
function restart(){ clearTimers(); step = 0; transition(showStep); }

function onActivate(){
  const s = STEPS[step];
  if(s.type === "intro"){ audio(); SFX.click(); next(); return; }
  if(s.type === "score"){ SFX.click(); restart(); return; }
  if((s.type === "bgCheck" || s.type === "mcCheck") && !revealed) return;  // wait for the synced reveal
  SFX.click(); next();
}

/* clicks anywhere advance, except on controls / the voice picker */
document.addEventListener("pointerup", e => {
  if(e.target.closest(".icon-btn") || e.target.closest(".controls-bar") ||
     e.target.closest("select") || e.target.closest(".voice-pick")) return;
  onActivate();
});
addEventListener("keydown", e => {
  if(e.key === " " || e.key === "Enter"){ e.preventDefault(); onActivate(); }
  else if(e.key === "ArrowRight"){ SFX.click(); next(); }
  else if(e.key === "ArrowLeft"){ SFX.click(); prev(); }
  else if(e.key.toLowerCase() === "p"){ togglePause(); }
  else if(e.key.toLowerCase() === "r"){ SFX.click(); restartRound(); }
  else if(e.key.toLowerCase() === "f"){ toggleFs(); }
});

const fsBtn  = document.getElementById("fsToggle");
ttsBtn.addEventListener("pointerup", e => { e.stopPropagation();
  ttsOn = !ttsOn; ttsBtn.classList.toggle("is-on", ttsOn); ttsBtn.classList.toggle("is-off", !ttsOn);
  ttsBtn.textContent = ttsOn ? "🗣️" : "🔇"; if(!ttsOn) cancelSpeech();
});
sfxBtn.addEventListener("pointerup", e => { e.stopPropagation();
  sfxOn = !sfxOn; sfxBtn.classList.toggle("is-on", sfxOn); sfxBtn.classList.toggle("is-off", !sfxOn);
  sfxBtn.textContent = sfxOn ? "🔔" : "🔕"; if(sfxOn){ audio(); SFX.click(); }
});
function toggleFs(){ if(!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); }
fsBtn.addEventListener("pointerup", e => { e.stopPropagation(); toggleFs(); });
if(!hasTTS){ ttsOn = false; ttsBtn.style.display = "none"; }

/* background blobs */
const blobs = [
  {e:"💍",top:"8%",left:"5%",size:"3.8rem",anim:"pulse1",dur:"6s",delay:"0s"},
  {e:"🌸",top:"15%",left:"82%",size:"3.2rem",anim:"pulse2",dur:"8s",delay:"1s"},
  {e:"🥂",top:"40%",left:"90%",size:"4rem",anim:"pulse3",dur:"7s",delay:"0.5s"},
  {e:"💐",top:"65%",left:"4%",size:"3.5rem",anim:"pulse2",dur:"9s",delay:"2s"},
  {e:"🕊️",top:"75%",left:"78%",size:"3rem",anim:"pulse1",dur:"6.5s",delay:"1.5s"},
  {e:"🌹",top:"30%",left:"3%",size:"2.8rem",anim:"pulse3",dur:"10s",delay:"0.8s"},
  {e:"✨",top:"55%",left:"88%",size:"2.5rem",anim:"pulse2",dur:"5s",delay:"3s"},
  {e:"💫",top:"85%",left:"50%",size:"3rem",anim:"pulse1",dur:"7.5s",delay:"2.5s"},
  {e:"🎀",top:"5%",left:"45%",size:"2.6rem",anim:"pulse3",dur:"8.5s",delay:"1.2s"},
  {e:"💒",top:"88%",left:"15%",size:"3.4rem",anim:"pulse2",dur:"11s",delay:"0.3s"},
];
document.getElementById("bg-layer").innerHTML = blobs.map(b =>
  `<div class="blob" style="top:${b.top};left:${b.left};font-size:${b.size};animation:${b.anim} ${b.dur} ease-in-out infinite ${b.delay};">${b.e}</div>`
).join("");

/* go */
if(!QUIZ.rounds || !totalQuestions){
  stage.innerHTML = `<div class="glass q-card"><p class="q-text">No questions found. Add some to questions.js and refresh.</p></div>`;
} else {
  renderIntro();
}
updatePauseBtn();
</script>
</body>
</html>
