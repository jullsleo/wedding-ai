<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Wedding Quiz 💍</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;width:100%;}
body{
  min-height:100vh;
  font-family:'Georgia',serif;
  background:linear-gradient(135deg,#fdf6e3 0%,#f5eef8 45%,#eaf4fb 100%);
  display:flex;align-items:flex-start;justify-content:center;
  padding:2rem 1rem;
}
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Lato:wght@300;400&display=swap');

#stage{
  width:100%;max-width:620px;
  display:flex;flex-direction:column;align-items:center;
  gap:1.4rem;
  position:relative;
  z-index:1;
}

.glass{
  background:rgba(255,255,255,0.38);
  backdrop-filter:blur(18px) saturate(160%);
  -webkit-backdrop-filter:blur(18px) saturate(160%);
  border:1.5px solid rgba(255,255,255,0.72);
  border-radius:22px;
  box-shadow:0 4px 32px rgba(180,160,220,0.13), inset 0 1px 0 rgba(255,255,255,0.9);
}

.q-label{
  font-size:12px;letter-spacing:0.14em;text-transform:uppercase;
  color:#b9a8d4;font-family:'Lato',sans-serif;font-weight:300;
}

.q-card{width:100%;padding:2rem 2.2rem;text-align:center;}
.q-text{
  font-family:'Playfair Display',serif;
  font-size:1.55rem;color:#4a3f6b;line-height:1.45;font-weight:500;
}

.progress-wrap{width:100%;height:4px;background:rgba(200,180,230,0.2);border-radius:99px;overflow:hidden;}
.progress-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#d8b4f8,#93c5fd);transition:width 0.5s ease;}

.timer-wrap{position:relative;width:72px;height:72px;flex-shrink:0;}
.timer-wrap svg{position:absolute;top:0;left:0;transform:rotate(-90deg);}
.t-track{fill:none;stroke:rgba(200,180,240,0.2);stroke-width:5;}
.t-prog{fill:none;stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset 1s linear,stroke 0.4s;}
.t-num{
  position:absolute;top:0;left:0;width:72px;height:72px;
  display:flex;align-items:center;justify-content:center;
  font-family:'Playfair Display',serif;
  font-size:1.4rem;color:#7a65a5;font-weight:500;line-height:1;
}

.opts-grid{width:100%;display:grid;gap:0.9rem;}
.opts-2col{grid-template-columns:1fr 1fr;}

.opt-card{
  padding:1.2rem 1.4rem;text-align:center;cursor:pointer;
  transition:transform 0.15s,box-shadow 0.2s;
  position:relative;overflow:hidden;
}
.opt-card:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(180,160,220,0.18),inset 0 1px 0 rgba(255,255,255,0.9);}
.opt-card .card-text{font-family:'Playfair Display',serif;font-size:1.05rem;color:#4a3f6b;font-weight:400;}

.cy{background:rgba(255,247,210,0.22);border-color:rgba(255,218,120,0.55)!important;}
.cl{background:rgba(240,225,255,0.22);border-color:rgba(200,170,230,0.55)!important;}
.cb{background:rgba(220,237,255,0.22);border-color:rgba(160,200,240,0.55)!important;}
.cp{background:rgba(255,230,237,0.22);border-color:rgba(240,185,200,0.55)!important;}

.opt-correct{
  background:rgba(240,255,240,0.72)!important;
  border-color:rgba(150,210,140,0.85)!important;
  box-shadow:0 0 0 3px rgba(160,220,150,0.25),
             0 0 22px 6px rgba(150,215,135,0.35),
             0 0 55px 16px rgba(190,240,175,0.18),
             inset 0 1px 0 rgba(255,255,255,0.95)!important;
  transform:scale(1.035)!important;
}
.opt-wrong{opacity:0.32!important;transform:scale(0.97)!important;}

.btn{
  font-family:'Playfair Display',serif;font-size:1rem;color:#6b5490;
  background:rgba(255,255,255,0.52);
  border:1.5px solid rgba(200,170,230,0.65);
  border-radius:50px;padding:0.7rem 2.4rem;cursor:pointer;
  backdrop-filter:blur(10px);transition:background 0.18s,transform 0.12s;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.9);
}
.btn:hover{background:rgba(255,255,255,0.78);transform:translateY(-1px);}

.reveal-tag{
  font-size:11px;letter-spacing:0.12em;text-transform:uppercase;
  color:#8aab7a;font-family:'Lato',sans-serif;font-weight:400;
  animation:fadeup 0.4s ease;
}

.melt-out{animation:meltOut 0.6s ease forwards;}
.melt-in {animation:meltIn  0.65s ease forwards;}

@keyframes meltOut{
  0%   {opacity:1; transform:scaleY(1)    translateY(0px)  skewX(0deg);  filter:blur(0px)   brightness(1);}
  15%  {opacity:1; transform:scaleY(1.04) translateY(-4px) skewX(1deg);  filter:blur(0px)   brightness(1.05);}
  40%  {opacity:0.7;transform:scaleY(1.12) translateY(10px) skewX(-2deg); filter:blur(2px)   brightness(1.1);}
  70%  {opacity:0.3;transform:scaleY(0.85) translateY(32px) skewX(3deg);  filter:blur(7px)   brightness(1.2);}
  100% {opacity:0; transform:scaleY(0.5)  translateY(60px) skewX(0deg);  filter:blur(14px)  brightness(1.4);}
}
@keyframes meltIn{
  0%   {opacity:0; transform:scaleY(1.18) translateY(-30px) skewX(-2deg); filter:blur(12px)  brightness(1.3);}
  25%  {opacity:0.5;transform:scaleY(1.06) translateY(-10px) skewX(1deg);  filter:blur(5px)   brightness(1.1);}
  60%  {opacity:0.9;transform:scaleY(0.98) translateY(3px)   skewX(-0.5deg);filter:blur(1px)  brightness(1.02);}
  80%  {opacity:1; transform:scaleY(1.01) translateY(-1px)  skewX(0deg);  filter:blur(0px)   brightness(1);}
  100% {opacity:1; transform:scaleY(1)    translateY(0px)   skewX(0deg);  filter:blur(0px)   brightness(1);}
}

@keyframes fadeup{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

.blob{position:absolute;font-size:3.2rem;filter:blur(2px);opacity:0.32;user-select:none;will-change:transform,font-size,opacity;}

@keyframes pulse1{
  0%  {transform:scale(1)   rotate(0deg);  opacity:0.28;}
  25% {transform:scale(1.3) rotate(8deg);  opacity:0.38;}
  50% {transform:scale(0.9) rotate(-5deg); opacity:0.30;}
  75% {transform:scale(1.2) rotate(12deg); opacity:0.35;}
  100%{transform:scale(1)   rotate(0deg);  opacity:0.28;}
}
@keyframes pulse2{
  0%  {transform:scale(1)   translateY(0px)   rotate(0deg);  opacity:0.30;}
  33% {transform:scale(1.4) translateY(-14px) rotate(-10deg);opacity:0.40;}
  66% {transform:scale(0.85)translateY(8px)   rotate(6deg);  opacity:0.24;}
  100%{transform:scale(1)   translateY(0px)   rotate(0deg);  opacity:0.30;}
}
@keyframes pulse3{
  0%  {transform:scale(1.1) rotate(0deg)   translateX(0px); opacity:0.32;}
  20% {transform:scale(0.8) rotate(-15deg) translateX(-8px);opacity:0.22;}
  50% {transform:scale(1.35)rotate(10deg)  translateX(6px); opacity:0.42;}
  80% {transform:scale(0.95)rotate(-5deg)  translateX(-4px);opacity:0.30;}
  100%{transform:scale(1.1) rotate(0deg)   translateX(0px); opacity:0.32;}
}

@keyframes float1{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-10px) rotate(5deg)}}
@keyframes float2{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-8px) rotate(-4deg)}}
</style>
</head>
<body>

<div id="bg-layer" style="position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;"></div>
<div id="stage" style="z-index:1;position:relative;"></div>

<script>
/* =============================================
   EDIT YOUR QUESTIONS HERE
   type: 'bg'  = Bride or Groom  (5 sec timer)
   type: 'mc'  = Multiple choice (10 sec timer)
   correct: exact string matching one of the options
   colors: cy=yellow, cl=lilac, cb=blue, cp=pink
============================================= */
const Q=[
  {type:'bg', text:'Who is the bigger spender?',           correct:'Groom'},
  {type:'bg', text:'Who said "I love you" first?',         correct:'Bride'},
  {type:'mc', text:'Where did the couple first meet?',
   options:['University','Metro station','Summer camp','Football game'],
   correct:'Summer camp', colors:['cy','cl','cb','cp']},
  {type:'bg', text:'Who is always late?',                  correct:'Bride'},
  {type:'mc', text:'Where did they go on their first date?',
   options:['A cosy café','A rooftop bar','The cinema','A park picnic'],
   correct:'A rooftop bar', colors:['cp','cy','cl','cb']},
  {type:'mc', text:'What song did they slow-dance to first?',
   options:["Perfect – Ed Sheeran","Can't Help Falling in Love","A Thousand Years","At Last – Etta James"],
   correct:"Can't Help Falling in Love", colors:['cl','cb','cp','cy']},
  {type:'bg', text:'Who cooks most of the time?',          correct:'Groom'},
];
/* ============================================= */

const R=28, C=2*Math.PI*R;
let qi=0,tLeft=0,tMax=5,ticker=null,answered=false,readPhase=false,paused=false;
const stage=document.getElementById('stage');

function setHTML(html){
  stage.className='';
  void stage.offsetWidth;
  stage.innerHTML=html;
  stage.className='melt-in';
}

function transition(buildFn){
  stage.className='melt-out';
  setTimeout(()=>{ buildFn(); stage.className='melt-in'; },620);
}

function showIntro(){
  setHTML(`
    <div style="display:flex;flex-direction:column;align-items:center;gap:1.8rem;padding-top:0.5rem;width:100%;">
      <div style="font-size:3rem;animation:float1 5s ease-in-out infinite">💍</div>
      <div class="glass" style="width:100%;padding:2rem 2.2rem;text-align:center;">
        <p style="font-family:'Playfair Display',serif;font-size:2rem;color:#4a3f6b;font-weight:500;line-height:1.3">
          How well do you know<br>the happy couple?
        </p>
        <p style="font-size:0.88rem;color:#b9a8d4;font-family:'Lato',sans-serif;margin-top:0.7rem;font-weight:300">
          ${Q.length} questions &nbsp;·&nbsp; Bride or Groom &amp; Multiple choice
        </p>
      </div>
      <div style="display:flex;gap:1rem;justify-content:center;">
        <div class="glass cy opt-card" style="width:148px;cursor:default;padding:1.2rem 1rem;">
          <div style="font-size:1.8rem">👰</div>
          <div style="font-family:'Playfair Display',serif;font-size:1rem;color:#7a5c20;margin-top:0.5rem">Bride</div>
        </div>
        <div class="glass cl opt-card" style="width:148px;cursor:default;padding:1.2rem 1rem;">
          <div style="font-size:1.8rem">🤵</div>
          <div style="font-family:'Playfair Display',serif;font-size:1rem;color:#5c4a8a;margin-top:0.5rem">Groom</div>
        </div>
      </div>
      <button class="btn" onclick="startQuiz()">Begin the quiz ✨</button>
    </div>`);
}

function startQuiz(){
  qi=0;
  transition(()=>showQuestion());
}

function showQuestion(){
  const q=Q[qi];
  answered=false; paused=false;
  clearInterval(ticker);
  readPhase=true;
  tMax=q.type==='bg'?5:10;
  tLeft=tMax;

  setHTML(`
    <div style="display:flex;flex-direction:column;align-items:center;gap:1.3rem;width:100%;" id="qwrap">
      <div class="progress-wrap"><div class="progress-fill" style="width:${qi/Q.length*100}%"></div></div>
      <p class="q-label">Question ${qi+1} of ${Q.length}</p>
      <div class="glass q-card" id="qcard">
        <p class="q-text">${q.text}</p>
      </div>
      <div id="timer-slot" style="opacity:0;transition:opacity 0.4s;display:flex;align-items:center;gap:0.9rem;">
        ${timerSVG(tLeft,tMax)}
        <button class="btn" id="pause-btn" onclick="togglePause()" style="padding:0.5rem 1.4rem;font-size:0.88rem;">⏸ Pause</button>
      </div>
      <div id="opts-wrap" style="width:100%;opacity:0;transform:translateY(14px);transition:opacity 0.45s,transform 0.45s;">
        ${buildOpts(q,false)}
      </div>
    </div>`);

  setTimeout(()=>{
    readPhase=false;
    const ow=document.getElementById('opts-wrap');
    const ts=document.getElementById('timer-slot');
    if(ow){ow.style.opacity='1';ow.style.transform='none';}
    if(ts){ts.style.opacity='1';}
    startTicker();
  },2000);
}

function buildOpts(q,reveal){
  const isBG=q.type==='bg';
  const opts=isBG
    ?[{label:'👰 Bride',cls:'cy'},{label:'🤵 Groom',cls:'cl'}]
    :q.options.map((o,i)=>({label:o,cls:q.colors[i]}));
  return `<div class="opts-grid opts-2col">
    ${opts.map((o,i)=>{
      let extra='';
      if(reveal){
        const lbl=isBG?o.label.replace(/👰 |🤵 /,''):o.label;
        if(lbl===q.correct||lbl.includes(q.correct)||q.correct.includes(lbl)) extra='opt-correct';
        else extra='opt-wrong';
      }
      return `<div class="glass opt-card ${o.cls} ${extra}" id="opt${i}" onclick="choose(${i})" style="${reveal?'pointer-events:none':''}">
        <p class="card-text">${o.label}</p>
      </div>`;
    }).join('')}
  </div>`;
}

function timerSVG(t,max){
  const pct=t/max;
  const offset=C*(1-pct);
  const col=pct>0.5?'#b8a5e0':pct>0.25?'#f6c97e':'#f4a5a5';
  return `<div class="timer-wrap">
    <svg width="72" height="72" viewBox="0 0 72 72">
      <circle class="t-track" cx="36" cy="36" r="${R}"/>
      <circle class="t-prog" cx="36" cy="36" r="${R}"
        stroke="${col}" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${offset.toFixed(2)}"/>
    </svg>
    <div class="t-num">${t}</div>
  </div>`;
}

function startTicker(){
  clearInterval(ticker);
  ticker=setInterval(()=>{
    if(paused) return;
    tLeft--;
    if(tLeft<=0){clearInterval(ticker);tLeft=0;revealAnswer();}
    else updateTimerSlot();
  },1000);
}

function updateTimerSlot(){
  const ts=document.getElementById('timer-slot');
  if(!ts) return;
  const pauseLabel=paused?'▶ Resume':'⏸ Pause';
  ts.innerHTML=timerSVG(tLeft,tMax)+
    `<button class="btn" id="pause-btn" onclick="togglePause()" style="padding:0.5rem 1.4rem;font-size:0.88rem;">${pauseLabel}</button>`;
  document.getElementById('pause-btn').onclick=togglePause;
}

function togglePause(){
  if(answered||readPhase) return;
  paused=!paused;
  updateTimerSlot();
}

function choose(idx){
  if(answered||readPhase) return;
  answered=true;
  clearInterval(ticker);
  revealAnswer(idx);
}

function revealAnswer(){
  answered=true; paused=false;
  clearInterval(ticker);
  const q=Q[qi];
  const isBG=q.type==='bg';
  const opts=isBG?[{label:'Bride'},{label:'Groom'}]:q.options.map(o=>({label:o}));

  const ts=document.getElementById('timer-slot');
  if(ts) ts.innerHTML=`<div style="font-size:1.7rem;line-height:1;animation:fadeup 0.3s ease">⏰</div>`;

  opts.forEach((_,i)=>{
    const el=document.getElementById('opt'+i);
    if(!el) return;
    const lbl=isBG?el.querySelector('.card-text').textContent.replace(/👰 |🤵 /,''):el.querySelector('.card-text').textContent;
    if(lbl===q.correct||lbl.includes(q.correct)||q.correct.includes(lbl)){
      el.className=el.className.replace(/opt-correct|opt-wrong/g,'').trim()+' opt-correct';
    } else {
      el.className=el.className.replace(/opt-correct|opt-wrong/g,'').trim()+' opt-wrong';
    }
    el.style.pointerEvents='none';
  });

  setTimeout(()=>{
    const ow=document.getElementById('opts-wrap');
    if(ow){
      const tag=document.createElement('p');
      tag.className='reveal-tag';
      tag.textContent='✓ Correct answer revealed';
      ow.after(tag);
    }
  },250);

  setTimeout(()=>{
    if(qi>=Q.length-1){ transition(showScore); }
    else { qi++; transition(showQuestion); }
  },2800);
}

function showScore(){
  clearInterval(ticker);
  setHTML(`
    <div style="display:flex;flex-direction:column;align-items:center;gap:1.8rem;padding-top:0.5rem;width:100%;">
      <div style="font-size:3rem;animation:float2 5s ease-in-out infinite">🥂</div>
      <div class="glass" style="width:100%;padding:2rem 2.2rem;text-align:center;">
        <p style="font-family:'Playfair Display',serif;font-size:1.9rem;color:#4a3f6b;font-weight:500">Quiz complete!</p>
      </div>
      <div class="glass cl" style="width:100%;padding:1.6rem 2rem;text-align:center;">
        <p style="font-family:'Playfair Display',serif;font-size:1.1rem;color:#5c4a8a;">
          Thank you for celebrating with us 💕
        </p>
        <p style="font-size:0.88rem;color:#b9a8d4;font-family:'Lato',sans-serif;margin-top:0.5rem;font-weight:300">
          Now you know the couple a little better ✨
        </p>
      </div>
      <button class="btn" onclick="qi=0;transition(showQuestion)">Play again 🔁</button>
    </div>`);
}

const blobs=[
  {e:'💍', top:'8%',  left:'5%',  size:'3.8rem', anim:'pulse1', dur:'6s',  delay:'0s'},
  {e:'🌸', top:'15%', left:'82%', size:'3.2rem', anim:'pulse2', dur:'8s',  delay:'1s'},
  {e:'🥂', top:'40%', left:'90%', size:'4rem',   anim:'pulse3', dur:'7s',  delay:'0.5s'},
  {e:'💐', top:'65%', left:'4%',  size:'3.5rem', anim:'pulse2', dur:'9s',  delay:'2s'},
  {e:'🕊️', top:'75%', left:'78%', size:'3rem',   anim:'pulse1', dur:'6.5s',delay:'1.5s'},
  {e:'🌹', top:'30%', left:'3%',  size:'2.8rem', anim:'pulse3', dur:'10s', delay:'0.8s'},
  {e:'✨', top:'55%', left:'88%', size:'2.5rem', anim:'pulse2', dur:'5s',  delay:'3s'},
  {e:'💫', top:'85%', left:'50%', size:'3rem',   anim:'pulse1', dur:'7.5s',delay:'2.5s'},
  {e:'🎀', top:'5%',  left:'45%', size:'2.6rem', anim:'pulse3', dur:'8.5s',delay:'1.2s'},
  {e:'💒', top:'88%', left:'15%', size:'3.4rem', anim:'pulse2', dur:'11s', delay:'0.3s'},
];
document.getElementById('bg-layer').innerHTML=blobs.map(b=>
  `<div class="blob" style="top:${b.top};left:${b.left};font-size:${b.size};animation:${b.anim} ${b.dur} ease-in-out infinite ${b.delay};">${b.e}</div>`
).join('');

showIntro();
</script>
</body>
</html>
